name: Telegram Bot

on:
  workflow_dispatch:
  schedule:
    # GitHub-hosted runners have a 6-hour maximum job execution window.
    # Start a fresh run every 6 hours; the current run exits before the next one.
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUPER_ADMIN: ${{ secrets.SUPER_ADMIN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          BANK_QR_URL: ${{ secrets.BANK_QR_URL }}
          BANK_ACCOUNT: ${{ secrets.BANK_ACCOUNT }}
          BANK_ACCOUNT_NAME: ${{ secrets.BANK_ACCOUNT_NAME }}
          BANK_NAME: ${{ secrets.BANK_NAME }}
          CHANNEL_IDS: ${{ secrets.CHANNEL_IDS }}
          SUPPORT: ${{ secrets.SUPPORT }}
          THE_CAO_PARTNER: ${{ secrets.THE_CAO_PARTNER }}
          THE_CAO_KEY: ${{ secrets.THE_CAO_KEY }}
          THE_CAO_WALLET: ${{ secrets.THE_CAO_WALLET }}
          THE_CAO_URL: ${{ secrets.THE_CAO_URL }}
          GITHUB_SYNC_DATA: '1'
          GITHUB_SYNC_INTERVAL: '300'
          GITHUB_DISABLE_RENTAL_CHILD: '0'
        run: python bot_vnping_github.py
